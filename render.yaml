services:
  - type: web
    name: shl-recommender
    runtime: python
    buildCommand: pip install -r requirements_minimal.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false   # set this manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.15
    healthCheckPath: /health
